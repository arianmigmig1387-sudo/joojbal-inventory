<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جوجبال | قیمت</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5f2ec;color:#181818}
.wrap{max-width:600px;margin:auto;padding:24px 15px 40px}
header{text-align:center;margin-bottom:22px}
.logo{width:130px;height:130px;object-fit:cover;border-radius:50%;background:#fff;box-shadow:0 8px 25px #0001}
h1{margin:13px 0 4px;font-size:30px}.sub{color:#777;font-size:14px}
.card{background:#fff;border-radius:20px;padding:18px;margin:12px 0;display:flex;align-items:center;justify-content:space-between;box-shadow:0 5px 18px #0000000d}
.name{font-size:18px;font-weight:bold}.price{font-size:15px;margin-top:7px;font-weight:bold}
.unit{font-size:12px;color:#777;font-weight:normal}.status{padding:8px 12px;border-radius:99px;background:#e8f7ec;color:#16833b;font-size:12px;font-weight:bold}
.footer{text-align:center;color:#999;font-size:12px;margin-top:24px}
</style>
</head>
<body>
<div class="wrap">
<header>
<img class="logo" src="jojbal_logo.jpg" alt="لوگوی جوجبال">
<h1>جوجبال</h1>
<div class="sub">موجودی و قیمت امروز</div>
</header>

<div class="card"><div><div class="name">🍗 کتف و بال</div><div class="price">۱٬۲۰۰ تومان <span class="unit">هر کیلو</span></div></div><span class="status">30 موجود</span></div>
<div class="card"><div><div class="name">🍗 مرغ بریان</div><div class="price">۱٬۲۰۰ تومان <span class="unit">هر عدد</span></div></div><span class="status">10 موجود</span></div>
<div class="card"><div><div class="name">🍗 ران مرغ</div><div class="price">۵۵۰ تومان <span class="unit">هر عدد</span></div></div><span class="status">21 موجود</span></div>
<div class="card"><div><div class="name">🥔 سیب‌زمینی کبابی</div><div class="price">۲۵۰ تومان <span class="unit">هر پرس</span></div></div><span class="status">50 موجود</span></div>

<div class="footer">برای اطلاع از قیمت و موجودی، این صفحه را بررسی کنید.</div>
</div>
</body>
</html>
